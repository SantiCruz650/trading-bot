version: '3.8'

services:
  ml_service:
    build: ./ml_service
    container_name: trading-bot-ml-service-headless
    ports:
      - "8001:8001"
    environment:
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY}
    volumes:
      - ./ml_service:/app
    networks:
      - trading-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: trading-bot-backend-headless
    ports:
      - "8000:8000"
    environment:
      - ML_SERVICE_URL=http://ml_service:8001
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY}
      - HEADLESS_MODE=true
    volumes:
      - ./backend:/app
    depends_on:
      ml_service:
        condition: service_healthy
    networks:
      - trading-network

networks:
  trading-network:
    driver: bridge
